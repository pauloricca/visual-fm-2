services:
  web:
    build:
      context: .
    ports:
      - "${TEIA_HOST_PORT:-${VISUAL_FM_HOST_PORT:-5174}}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      TEIA_HTTPS_KEY: "${TEIA_HTTPS_KEY:-${VISUAL_VISUAL_HTTPS_KEY:-/app/.cert/teia.key}}"
      TEIA_HTTPS_CERT: "${TEIA_HTTPS_CERT:-${VISUAL_VISUAL_HTTPS_CERT:-/app/.cert/teia.crt}}"
      VITE_TEIA_PATCH_STORAGE: "${VITE_TEIA_PATCH_STORAGE:-${VITE_VISUAL_VISUAL_PATCH_STORAGE:-local}}"
      VITE_TEIA_THEME: "${VITE_TEIA_THEME:-${VITE_VISUAL_FM_THEME:-}}"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    # Serve source files with Vite HMR; the bind mount and polling settings above
    # make React and CSS edits appear without rebuilding the Docker image.
    command: npm run dev

volumes:
  node_modules:
